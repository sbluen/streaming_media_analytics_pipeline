version: 2

sources:
  - name: raw_streaming
    description: Raw streaming events ingested from Kafka via the containerized consumer.
    database: streaming_analytics  # Must match your dbname in profiles.yml
    schema: public                 # The Postgres schema where your raw table lives
    tables:
      - name: raw_streaming_events
        description: Unfiltered stream of track plays, user IDs, platforms, and Kafka tracking offsets.
        columns:
          - name: event_id
            description: Surrogate primary key generated by PostgreSQL.
            tests:
              - unique
              - not_null

          - name: kafka_partition
            description: The Kafka partition number the event came from.
            tests:
              - not_null

          - name: kafka_offset
            description: The Kafka offset bookmark for idempotency.
            tests:
              - not_null

          - name: track_id
            description: Identifier of the track being played.
            tests:
              - not_null

          - name: user_id
            description: Identifier of the user streaming the track.
            tests:
              - not_null

          - name: platform
            description: The streaming platform source (e.g., Spotify, Apple Music).
            tests:
              - not_null

          - name: created_at
            description: Timestamp when the event was generated or recorded.
            tests:
              - not_null
